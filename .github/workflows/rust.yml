name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - uses: awalsh128/cache-apt-pkgs-action@latest
      with:
        packages: pkg-config libfreetype-dev
    - uses: Swatinem/rust-cache@v2
      with:
        shared-key: workspace-ubuntu-latest
        save-if: false
    - run: cargo check --workspace --all-targets

  clippy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - uses: awalsh128/cache-apt-pkgs-action@latest
      with:
        packages: pkg-config libfreetype-dev
    - uses: Swatinem/rust-cache@v2
      with:
        shared-key: workspace-ubuntu-latest
        save-if: false
    - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - uses: awalsh128/cache-apt-pkgs-action@latest
      with:
        packages: pkg-config libfreetype-dev
    - uses: Swatinem/rust-cache@v2
      with:
        shared-key: workspace-ubuntu-latest
        save-if: false
    - run: cargo test --workspace

  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v5
    - if: runner.os == 'Linux'
      uses: awalsh128/cache-apt-pkgs-action@latest
      with:
        packages: pkg-config libfreetype-dev
    - if: runner.os == 'macOS'
      run: brew install pkg-config freetype
    - uses: Swatinem/rust-cache@v2
      with:
        shared-key: workspace-${{ matrix.os }}
    # `msdfgen-sys` doesn't ship prebuilt FFI bindings for Windows and
    # `bindgen 0.63` (pinned by `msdfgen-sys 0.2.1`) panics on modern libclang's
    # `_Complex _Float16` builtin, so on Windows we exclude every workspace
    # member that enables the `text` feature. Cargo's resolver unifies features
    # across all non-excluded members, so this list must include EVERY example
    # whose `Cargo.toml` has `iced_glass = { ..., features = ["text"] }`,
    # otherwise `msdfgen` gets pulled into the resolved graph anyway.
    - if: runner.os != 'Windows'
      run: cargo build --workspace
    - if: runner.os == 'Windows'
      run: cargo build --workspace --exclude text --exclude desktop --exclude group_container
