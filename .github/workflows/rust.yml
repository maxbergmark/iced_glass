name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v5
    - if: runner.os == 'Linux'
      uses: awalsh128/cache-apt-pkgs-action@latest
      with:
        packages: pkg-config libfreetype-dev
    - if: runner.os == 'macOS'
      run: brew install pkg-config freetype
    - if: runner.os == 'Windows'
      shell: pwsh
      run: echo "LIBCLANG_PATH=$env:ProgramFiles\LLVM\bin" >> $env:GITHUB_ENV
    - uses: Swatinem/rust-cache@v2
      with:
        shared-key: workspace-${{ matrix.os }}
        save-if: false
    - run: cargo check --workspace --all-targets

  clippy:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v5
    - if: runner.os == 'Linux'
      uses: awalsh128/cache-apt-pkgs-action@latest
      with:
        packages: pkg-config libfreetype-dev
    - if: runner.os == 'macOS'
      run: brew install pkg-config freetype
    - if: runner.os == 'Windows'
      shell: pwsh
      run: echo "LIBCLANG_PATH=$env:ProgramFiles\LLVM\bin" >> $env:GITHUB_ENV
    - uses: Swatinem/rust-cache@v2
      with:
        shared-key: workspace-${{ matrix.os }}
        save-if: false
    - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v5
    - if: runner.os == 'Linux'
      uses: awalsh128/cache-apt-pkgs-action@latest
      with:
        packages: pkg-config libfreetype-dev
    - if: runner.os == 'macOS'
      run: brew install pkg-config freetype
    - if: runner.os == 'Windows'
      shell: pwsh
      run: echo "LIBCLANG_PATH=$env:ProgramFiles\LLVM\bin" >> $env:GITHUB_ENV
    - uses: Swatinem/rust-cache@v2
      with:
        shared-key: workspace-${{ matrix.os }}
        save-if: false
    - run: cargo test --workspace

  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v5
    - if: runner.os == 'Linux'
      uses: awalsh128/cache-apt-pkgs-action@latest
      with:
        packages: pkg-config libfreetype-dev
    - if: runner.os == 'macOS'
      run: brew install pkg-config freetype
    - if: runner.os == 'Windows'
      shell: pwsh
      run: echo "LIBCLANG_PATH=$env:ProgramFiles\LLVM\bin" >> $env:GITHUB_ENV
    - uses: Swatinem/rust-cache@v2
      with:
        shared-key: workspace-${{ matrix.os }}
    - run: cargo build --workspace
