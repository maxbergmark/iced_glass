[package]
name = "iced_glass"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Apple-style liquid/frosted glass widgets for iced, rendered via custom wgpu shader pipelines."
license = "MIT"
repository = "https://github.com/maxbergmark/iced_glass"
homepage = "https://github.com/maxbergmark/iced_glass"
documentation = "https://docs.rs/iced_glass"
readme = "README.md"
keywords = ["iced", "gui", "wgpu", "glass", "shader"]
categories = ["gui", "graphics", "rendering"]
exclude = ["docs/*.webp", "docs/*.png"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []
text = [
    "dep:msdfgen",
    "dep:notosans",
    "dep:freetype-rs",
    "dep:etagere",
    "dep:cosmic-text",
    "dep:itertools",
]

[dependencies]
iced = { git = "https://github.com/maxbergmark/iced", features = [
    "wgpu",
    "image",
    "advanced",
    "svg",
    "tokio",
], branch = "latest" }
iced_wgpu = { git = "https://github.com/maxbergmark/iced", branch = "latest" }

wgpu = { version = "27.0.1", features = [] }
bytemuck = "1.25.0"
num-traits = "0.2.19"
tracing = { version = "0.1.44", features = ["log"] }

# The `text` feature is not supported on Windows: `msdfgen-sys 0.2.1` doesn't
# ship prebuilt FFI bindings for Windows, and its pinned `bindgen 0.63` panics
# on modern libclang's `_Complex _Float16` builtin. The core glass widgets
# still work on Windows; only glyph rendering is affected.
msdfgen = { version = "0.2.1", features = ["freetype-rs"], optional = true }
notosans = { version = "0.1.0", optional = true }
freetype-rs = { version = "0.32.0", optional = true }
etagere = { version = "0.3.0", optional = true }
cosmic-text = { version = "0.19.0", optional = true }
itertools = { version = "0.14.0", optional = true }

[workspace]
members = [".", "examples/*"]

[workspace.dependencies]
iced_glass = { path = "." }
iced = { git = "https://github.com/maxbergmark/iced", features = [
    "wgpu",
    "image",
    "advanced",
    "svg",
    "tokio",
], branch = "latest" }

[lints.clippy]
map_err_ignore = "warn"
# missing_docs_in_private_items = "warn"

all = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }

cognitive_complexity = "warn"
dbg_macro = "warn"
debug_assert_with_mut_call = "warn"
doc_link_with_quotes = "warn"
doc_markdown = "warn"
empty_line_after_outer_attr = "warn"
# empty_structs_with_brackets = "warn"
float_cmp = "warn"
float_cmp_const = "warn"
float_equality_without_abs = "warn"
missing_const_for_fn = "warn"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
mod_module_files = "allow"
option_if_let_else = "warn"
print_stderr = "warn"
print_stdout = "warn"
semicolon_if_nothing_returned = "warn"
unseparated_literal_suffix = "warn"
shadow_unrelated = "warn"
similar_names = "warn"
suspicious_operation_groupings = "warn"
unused_self = "warn"
use_debug = "warn"
used_underscore_binding = "warn"
useless_let_if_seq = "warn"
wildcard_dependencies = "warn"
wildcard_imports = "warn"

panic = "warn"
panic_in_result_fn = "warn"
unwrap_used = "warn"
expect_used = "warn"
unreachable = "warn"
todo = "warn"

await_holding_lock = "warn"
char_lit_as_u8 = "warn"
checked_conversions = "warn"
empty_enums = "warn"
enum_glob_use = "warn"
exit = "warn"
expl_impl_clone_on_copy = "warn"
explicit_deref_methods = "warn"
explicit_into_iter_loop = "warn"
fallible_impl_from = "warn"
filter_map_next = "warn"
flat_map_option = "warn"
fn_params_excessive_bools = "warn"
from_iter_instead_of_collect = "warn"
if_let_mutex = "warn"
implicit_clone = "warn"
imprecise_flops = "warn"
inefficient_to_string = "warn"
invalid_upcast_comparisons = "warn"
large_digit_groups = "warn"
large_stack_arrays = "warn"
large_types_passed_by_value = "warn"
let_unit_value = "warn"
linkedlist = "warn"
lossy_float_literal = "warn"
macro_use_imports = "warn"
manual_ok_or = "warn"
map_flatten = "warn"
map_unwrap_or = "warn"
indexing_slicing = "allow"
match_same_arms = "warn"
match_wild_err_arm = "warn"
match_wildcard_for_single_variants = "warn"
mem_forget = "warn"
missing_enforced_import_renames = "warn"
mut_mut = "warn"
mutex_integer = "warn"
needless_borrow = "warn"
needless_continue = "warn"
needless_for_each = "allow"
option_option = "warn"
path_buf_push_overwrite = "warn"
ptr_as_ptr = "warn"
rc_mutex = "warn"
ref_option_ref = "warn"
rest_pat_in_fully_bound_structs = "warn"
same_functions_in_if_condition = "warn"
single_match_else = "warn"
string_add_assign = "warn"
string_add = "warn"
string_lit_as_bytes = "warn"
trait_duplication_in_bounds = "warn"
